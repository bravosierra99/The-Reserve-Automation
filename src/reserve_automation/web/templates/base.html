<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Reserve Automation{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">

    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <style>[x-cloak] { display: none !important; }</style>
    <nav class="bg-blue-600 text-white shadow-lg" x-data="authNav()" x-cloak>
        <div class="container mx-auto px-4">
            <!-- Title row + hamburger button (hamburger hidden on lg+) -->
            <div class="flex justify-between items-center py-3">
                <div>
                    <h1 class="text-xl font-bold leading-tight">The Reserve</h1>
                    <p class="text-xs text-blue-100">Bottle & Tasting Management</p>
                </div>
                <button @click="mobileOpen = !mobileOpen"
                        class="lg:hidden flex items-center justify-center w-10 h-10 rounded-lg hover:bg-blue-700 transition-colors"
                        :aria-expanded="mobileOpen.toString()">
                    <!-- Hamburger icon -->
                    <svg x-show="!mobileOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    <!-- Close icon -->
                    <svg x-show="mobileOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Nav links: hidden on mobile until hamburger opens, always visible on lg+ -->
            <div class="nav-links" :class="{ 'is-open': mobileOpen }">
                <div class="flex flex-col lg:flex-row flex-wrap gap-2">
                    <a x-show="p.bottles_view" href="/bottles" class="px-3 py-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold transition-colors text-sm">
                        Bottles
                    </a>
                    <a x-show="p.tastings_submit" href="/manual-tasting" class="px-3 py-2 bg-green-600 hover:bg-green-700 rounded-lg font-semibold transition-colors text-sm">
                        Tastings
                    </a>
                    <a x-show="p.upload_access" href="/upload" class="px-3 py-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold transition-colors text-sm">
                        Import
                    </a>
                    <a x-show="p.ingredients_view" href="/ingredients" class="px-3 py-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold transition-colors text-sm">
                        Ingredients
                    </a>
                    <a x-show="p.cocktails_view" href="/cocktails" class="px-3 py-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold transition-colors text-sm">
                        Cocktails
                    </a>
                    <a x-show="p.events_view" href="/events" class="px-3 py-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold transition-colors text-sm">
                        Events
                    </a>
                    <a x-show="p.management_access" href="/management" class="px-3 py-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold transition-colors text-sm">
                        Management
                    </a>
                </div>
                <!-- Identity display -->
                <div x-show="displayName" class="text-sm text-blue-100 pt-2 lg:pt-0 lg:border-l lg:border-blue-400 lg:pl-3">
                    <span x-text="displayName"></span>
                    <span x-show="role" class="text-blue-200">(<span x-text="role"></span>)</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Backup status banner (admin only, hidden when healthy) -->
    <div x-data="backupBanner()" x-cloak>
        <div x-show="visible && !dismissed"
             :class="level === 'red' ? 'bg-red-600 text-white' : 'bg-amber-400 text-amber-900'"
             class="w-full px-4 py-2 flex items-center justify-between text-sm font-medium">
            <span x-text="message"></span>
            <button @click="dismissed = true" class="ml-4 opacity-70 hover:opacity-100 text-lg leading-none">&times;</button>
        </div>
    </div>

    <!-- authNav() / backupBanner() / formatApiError() live in
         /static/js/components/base-page.js
         (extracted July 2026 for vitest coverage — tests/js/base-page.test.js) -->
    <script src="/static/js/components/base-page.js?v={{ static_v }}"></script>

    <main class="container mx-auto px-4 py-6 max-w-4xl">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-gray-500 text-sm py-8">
        <p>The Reserve Automation &copy; 2025</p>
    </footer>

    {% block scripts %}{% endblock %}

    {% include 'components/dev_toolbar.html' %}
</body>
</html>
