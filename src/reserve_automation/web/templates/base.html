<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Reserve Automation{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">

    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <style>[x-cloak] { display: none !important; }</style>
    <nav class="bg-blue-600 text-white p-4 shadow-lg" x-data="authNav()" x-cloak>
        <div class="container mx-auto">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold">The Reserve</h1>
                    <p class="text-sm text-blue-100">Bottle & Tasting Management</p>
                </div>
                <div class="flex gap-4 items-center">
                    <a x-show="p.bottles_view" href="/bottles" class="px-4 py-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold transition-colors">
                        Bottles
                    </a>
                    <a x-show="p.tastings_submit" href="/manual-tasting" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg font-semibold transition-colors">
                        Tastings
                    </a>
                    <a x-show="p.upload_access" href="/upload" class="px-4 py-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold transition-colors">
                        Import
                    </a>
                    <a x-show="p.ingredients_view" href="/ingredients" class="px-4 py-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold transition-colors">
                        Ingredients
                    </a>
                    <a x-show="p.cocktails_view" href="/cocktails" class="px-4 py-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold transition-colors">
                        Cocktails
                    </a>
                    <a x-show="p.events_view" href="/events" class="px-4 py-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold transition-colors">
                        Events
                    </a>
                    <a x-show="p.management_access" href="/management" class="px-4 py-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold transition-colors">
                        Management
                    </a>
                    <!-- Identity display -->
                    <div x-show="displayName" class="ml-2 text-sm text-blue-100 border-l border-blue-400 pl-4">
                        <span x-text="displayName"></span>
                        <span x-show="role" class="text-blue-200">(<span x-text="role"></span>)</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <script>
    function authNav() {
        return {
            displayName: '',
            role: '',
            p: {},  // permissions
            async init() {
                try {
                    const resp = await fetch('/api/v1/me');
                    const data = await resp.json();
                    this.displayName = data.display_name || '';
                    this.role = data.role || '';
                    this.p = data.permissions || {};
                } catch (e) {
                    // Default: show all links if /me fails
                    this.p = {
                        bottles_view: true, upload_access: true, tastings_submit: true,
                        ingredients_view: true, cocktails_view: true,
                        events_view: true, management_access: true,
                    };
                }
            }
        };
    }
    </script>

    <main class="container mx-auto px-4 py-6 max-w-4xl">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-gray-500 text-sm py-8">
        <p>The Reserve Automation &copy; 2025</p>
    </footer>

    {% block scripts %}{% endblock %}

    {% include 'components/dev_toolbar.html' %}
</body>
</html>
