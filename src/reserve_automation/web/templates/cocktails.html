{% extends "base.html" %}

{% block title %}Cocktails - The Reserve{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto p-4" x-data="cocktailsApp()">
    <div class="mb-6 flex justify-between items-start">
        <div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Cocktail Recipes</h1>
            <p class="text-gray-600">Browse and manage your cocktail collection</p>
        </div>
        <a href="#" @click.prevent="showCreateForm = true"
           class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg transition-colors">
            + New Cocktail
        </a>
    </div>

    <!-- Search bar -->
    <div class="mb-6">
        <input type="text" x-model="searchQuery" @input.debounce.300ms="loadCocktails()"
               placeholder="Search by name, ingredient, method..."
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Loading -->
    <div x-show="loading" class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
    </div>

    <!-- Empty state -->
    <div x-show="!loading && cocktails.length === 0" class="bg-white rounded-lg shadow-md p-12 text-center">
        <div class="text-6xl mb-4">🍸</div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">No Cocktails Yet</h2>
        <p class="text-gray-600 mb-6">Create your first cocktail recipe</p>
    </div>

    <!-- Recipe cards -->
    <div x-show="!loading && cocktails.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-for="cocktail in cocktails" :key="cocktail.id">
            <div class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow p-6 cursor-pointer"
                 @click="window.location.href = `/cocktails/${cocktail.id}/detail`">
                <h2 class="text-xl font-bold text-gray-800 mb-2" x-text="cocktail.name"></h2>
                <div x-show="cocktail.description" class="text-gray-600 text-sm mb-3" x-text="cocktail.description"></div>
                <div class="flex flex-wrap gap-2 mb-3">
                    <span x-show="cocktail.method" class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded" x-text="cocktail.method"></span>
                    <span x-show="cocktail.style" class="px-2 py-1 bg-purple-100 text-purple-800 text-xs rounded" x-text="cocktail.style"></span>
                    <span x-show="cocktail.glassware" class="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded" x-text="cocktail.glassware"></span>
                </div>
                <div class="text-sm text-gray-500">
                    <span x-text="cocktail.ingredients.length + ' ingredients'"></span>
                    <span x-show="cocktail.stars && cocktail.stars !== '--'" class="ml-2" x-text="cocktail.stars"></span>
                </div>
            </div>
        </template>
    </div>

    <!-- Create modal -->
    <div x-show="showCreateForm" x-transition
         class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
         @click.self="showCreateForm = false">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <h2 class="text-xl font-bold mb-4">New Cocktail Recipe</h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
                        <input type="text" x-model="newCocktail.name" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <input type="text" x-model="newCocktail.description" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Method</label>
                            <select x-model="newCocktail.method" class="w-full px-3 py-2 border rounded-lg">
                                <option value="">--</option>
                                <option>shaken</option><option>stirred</option><option>built</option><option>blended</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Style</label>
                            <select x-model="newCocktail.style" class="w-full px-3 py-2 border rounded-lg">
                                <option value="">--</option>
                                <option>classic</option><option>tiki</option><option>modern</option><option>sour</option><option>highball</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Glassware</label>
                            <input type="text" x-model="newCocktail.glassware" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Garnish</label>
                        <input type="text" x-model="newCocktail.garnish" class="w-full px-3 py-2 border rounded-lg">
                    </div>

                    <!-- Ingredients -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ingredients</label>
                        <template x-for="(ing, idx) in newCocktail.ingredients" :key="idx">
                            <div class="flex gap-2 mb-2 items-center">
                                <input type="number" x-model.number="ing.amount" placeholder="Amt" step="0.25" class="w-16 px-2 py-1 border rounded text-sm">
                                <select x-model="ing.unit" class="w-20 px-1 py-1 border rounded text-sm">
                                    <option value="">--</option>
                                    <option>oz</option><option>ml</option><option>dash</option><option>splash</option>
                                    <option>piece</option><option>wedge</option><option>barspoon</option>
                                </select>
                                <input type="text" x-model="ing.ingredient" placeholder="Ingredient name" list="ingredient-names"
                                       class="flex-1 px-2 py-1 border rounded text-sm">
                                <button @click="newCocktail.ingredients.splice(idx, 1)" class="text-red-500 hover:text-red-700 text-sm px-1">x</button>
                            </div>
                        </template>
                        <button @click="newCocktail.ingredients.push({ingredient:'',amount:null,unit:'oz',notes:'',optional:false})"
                                class="text-blue-600 hover:text-blue-800 text-sm">+ Add ingredient</button>
                        <datalist id="ingredient-names">
                            <template x-for="name in ingredientNames" :key="name">
                                <option :value="name"></option>
                            </template>
                        </datalist>
                    </div>

                    <!-- Instructions -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Instructions</label>
                        <template x-for="(step, idx) in newCocktail.instructions" :key="idx">
                            <div class="flex gap-2 mb-2 items-center">
                                <span class="text-gray-400 text-sm w-6" x-text="(idx+1) + '.'"></span>
                                <input type="text" x-model="newCocktail.instructions[idx]" class="flex-1 px-2 py-1 border rounded text-sm">
                                <button @click="newCocktail.instructions.splice(idx, 1)" class="text-red-500 hover:text-red-700 text-sm px-1">x</button>
                            </div>
                        </template>
                        <button @click="newCocktail.instructions.push('')" class="text-blue-600 hover:text-blue-800 text-sm">+ Add step</button>
                    </div>
                </div>

                <div class="flex gap-3 mt-6">
                    <button @click="saveCocktail()" :disabled="saving"
                            class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg">
                        <span x-text="saving ? 'Saving...' : 'Create'"></span>
                    </button>
                    <button @click="showCreateForm = false" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg">Cancel</button>
                </div>

                <div x-show="formError" class="mt-3 p-3 bg-red-50 text-red-700 rounded-lg text-sm" x-text="formError"></div>
            </div>
        </div>
    </div>
</div>

<script>
function cocktailsApp() {
    return {
        cocktails: [],
        loading: true,
        searchQuery: '',
        showCreateForm: false,
        saving: false,
        formError: '',
        ingredientNames: [],
        newCocktail: {
            name: '', description: '', method: '', style: '', glassware: '', garnish: '',
            ingredients: [{ingredient: '', amount: null, unit: 'oz', notes: '', optional: false}],
            instructions: [''],
        },

        async init() {
            await this.loadCocktails();
            await this.loadIngredientNames();
        },

        async loadCocktails() {
            try {
                this.loading = true;
                const url = this.searchQuery ? `/api/v1/cocktails?q=${encodeURIComponent(this.searchQuery)}` : '/api/v1/cocktails';
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                this.cocktails = await response.json();
            } catch (e) {
                console.error('Failed to load cocktails:', e);
            } finally {
                this.loading = false;
            }
        },

        async loadIngredientNames() {
            try {
                const response = await fetch('/api/v1/ingredients?flat=true');
                if (response.ok) {
                    const data = await response.json();
                    this.ingredientNames = data.map(i => i.name);
                }
            } catch (e) {}
        },

        async saveCocktail() {
            if (!this.newCocktail.name.trim()) { this.formError = 'Name is required'; return; }
            this.saving = true;
            this.formError = '';
            try {
                const payload = {
                    ...this.newCocktail,
                    ingredients: this.newCocktail.ingredients.filter(i => i.ingredient.trim()),
                    instructions: this.newCocktail.instructions.filter(s => s.trim()),
                    method: this.newCocktail.method || null,
                    style: this.newCocktail.style || null,
                    glassware: this.newCocktail.glassware || null,
                    garnish: this.newCocktail.garnish || null,
                    description: this.newCocktail.description || null,
                };
                const response = await fetch('/api/v1/cocktails', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    const error = await response.json();
                    this.formError = error.detail || 'Failed to save';
                    return;
                }
                this.showCreateForm = false;
                this.newCocktail = {
                    name: '', description: '', method: '', style: '', glassware: '', garnish: '',
                    ingredients: [{ingredient: '', amount: null, unit: 'oz', notes: '', optional: false}],
                    instructions: [''],
                };
                await this.loadCocktails();
            } catch (e) {
                this.formError = e.message;
            } finally {
                this.saving = false;
            }
        }
    };
}
</script>
{% endblock %}
