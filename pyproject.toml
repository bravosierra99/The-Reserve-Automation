[project]
name = "reserve-automation"
version = "1.10.0"
description = "Bottle ingestion automation for The Reserve spirits collection"
authors = [
    {name = "Ben Smith", email = "ben@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core
    "pydantic>=2.0",
    "click>=8.1",
    "pyyaml>=6.0",
    # LLM providers
    "httpx>=0.27",
    "anthropic>=0.20",
    "openai>=1.0",
    # Parsing
    "pdfplumber>=0.10",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "pdf2image>=1.16",
    "numpy>=1.24",
    # Generation
    "jinja2>=3.1",
    "GitPython>=3.1",
    # CLI/UI
    "rich>=13.0",
    "loguru>=0.7",
    # Keyless web search — shared helper (pulls ddgs transitively). Installed from
    # the tag tarball (not git+https) so the image needs no `git` and no token
    # (public repo). Pinned for reproducible container builds. Same pattern as the
    # quiz repo; do NOT re-vendor ddgs glue here.
    "websearch @ https://github.com/bravosierra99/websearch/archive/refs/tags/v0.1.0.tar.gz",
    "fastapi>=0.124.2",
    "uvicorn[standard]>=0.38.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=3.0.3",
    "itsdangerous>=2.2.0",
    "opencv-python>=4.11.0.86",
    "opencv-python-headless>=4.11.0.86",
    "easyocr>=1.7.2",
    "requests>=2.32.5",
    "llmwhisperer-client>=2.3.1",
    "beautifulsoup4>=4.14.3",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    # Auth
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.12",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.scripts]
reserve-automation = "reserve_automation.cli:cli"
populate-ingredients = "reserve_automation.scripts.populate_ingredients:main_cli"
reserve-agent = "reserve_automation.scripts.agent:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reserve_automation"]

# Required because `websearch` is a direct URL (tag-tarball) reference rather than
# a PyPI version spec; hatchling refuses to build with one unless this is opted in.
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# E501 (line length) is intentionally not enforced. The project carried ~480
# long lines across live + legacy + test code; line wrapping is the formatter's
# job, not the linter's, and hand-wrapping hundreds of legacy lines is churn for
# no behavioral gain. Adopt `ruff format` in a dedicated commit if width control
# is wanted later. Every other E/F/I/N/W rule IS enforced (and gated in CI).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests grandfather idiomatic patterns: bare `except:` used as in-test
# diagnostics, a JS-property-mirroring test name, local matrix-ish variable
# names, and conftest imports that must follow sys.path / env setup.
"tests/**" = ["E722", "N802", "N806", "E402"]
# Dev utility scripts: imports after load_dotenv()/sys.path; terse one-liners.
"scripts/**" = ["E402", "E701", "N806"]
"src/reserve_automation/scripts/**" = ["E402", "N806"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Exclude browser E2E tests by default: they launch a uvicorn subprocess +
# Playwright browser and hang under WSL. `uv run pytest` is therefore the fast,
# reliable gate (unit + integration + ui). Run the browser suite explicitly with
# `uv run pytest -m e2e` (CI does this on a Linux runner where the browser works).
addopts = "-m 'not e2e'"
# Timeout for individual tests (2 minutes default, E2E tests get 5 minutes)
timeout = 120
# Show live output during tests for progress visibility
log_cli = true
log_cli_level = "INFO"
# Custom markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as end-to-end browser tests",
    "requires_lm_studio: needs a reachable LM Studio endpoint; auto-skipped when unavailable (see tests/conftest.py)",
    "prod_smoke: opt-in live-prod smoke via Cloudflare service token; skipped unless RUN_PROD_SMOKE=1 (see tests/events/test_prod_cloudflare_smoke.py)",
]

[dependency-groups]
dev = [
    "playwright>=1.57.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-playwright>=0.7.2",
    "pytest-timeout>=2.3.1",
]
