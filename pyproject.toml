[project]
name = "reserve-automation"
version = "0.1.0"
description = "Bottle ingestion automation for The Reserve spirits collection"
authors = [
    {name = "Ben Smith", email = "ben@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core
    "pydantic>=2.0",
    "click>=8.1",
    "pyyaml>=6.0",
    # LLM providers
    "httpx>=0.27",
    "anthropic>=0.20",
    "openai>=1.0",
    # Parsing
    "pdfplumber>=0.10",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "pdf2image>=1.16",
    "numpy>=1.24",
    # Generation
    "jinja2>=3.1",
    "GitPython>=3.1",
    # CLI/UI
    "rich>=13.0",
    "loguru>=0.7",
    "ddgs>=9.9.3",
    "fastapi>=0.124.2",
    "uvicorn[standard]>=0.38.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=3.0.3",
    "itsdangerous>=2.2.0",
    "opencv-python>=4.11.0.86",
    "opencv-python-headless>=4.11.0.86",
    "easyocr>=1.7.2",
    "requests>=2.32.5",
    "llmwhisperer-client>=2.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.12",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.scripts]
reserve-automation = "reserve_automation.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reserve_automation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
