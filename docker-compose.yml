services:
  web:
    build: .
    container_name: reserve-app
    # Bind to loopback only by default so the only ingress is the Cloudflare
    # Tunnel sidecar (cloudflared connects to the app over the host loopback or
    # the docker network). Override WEB_BIND_HOST=0.0.0.0 only on hosts that
    # don't need Cloudflare gating (e.g. a fully isolated LAN dev box).
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - reserve_temp:/tmp/reserve_uploads
      - reserve_logs:/app/logs
    environment:
      - WEB_SECRET_KEY=${WEB_SECRET_KEY}
      - DATABASE_URL=sqlite:///data/reserve.db
      - MEDIA_DIR=data/media
      - RESERVE_LM_STUDIO_URL=http://${LM_STUDIO_HOST:-192.168.86.2}:${LM_STUDIO_PORT:-1234}/v1
      - LM_STUDIO_API_KEY=${LM_STUDIO_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLMWHISPERER_API_KEY=${LLMWHISPERER_API_KEY:-}
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
      # Pass auth dev-mode toggle through from .env. Committed here so it
      # survives `git reset --hard` on deploy; the value stays in the host's
      # gitignored .env (no secret in git). Curated explicitly — do NOT switch
      # to `env_file: .env`, which also injects RESERVE_VAULT_PATH=/vault/Cellar
      # and crashes CoreConfig (the container doesn't mount /vault).
      - AUTH_DEV_ENABLED=${AUTH_DEV_ENABLED:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  reserve_temp:
    driver: local
  reserve_logs:
    driver: local
