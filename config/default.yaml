# Default configuration for The Reserve Automation
# User-specific settings should go in user.yaml (gitignored)

# Project metadata
project:
  name: "The Reserve Automation"
  version: "0.1.0"

# File paths (can be overridden in user.yaml)
paths:
  vault: null  # REQUIRED: Set in user.yaml
  config_dir: "config"
  templates_dir: "templates"
  cache_dir: ".cache"
  logs_dir: "logs"

# LLM provider configuration
# Override any of these in user.yaml (gitignored) for your deployment.
# See config/llm.yaml.example for annotated provider/routing options.
llm:
  providers:
    lm_studio_vision:
      provider: lm_studio
      base_url: "http://localhost:1234/v1"
      model: "qwen/qwen3-vl-8b"
      timeout: 180
      model_load_timeout: 360
      max_retries: 2
      context_length: 16384

    lm_studio_text:
      provider: lm_studio
      base_url: "http://localhost:1234/v1"
      model: "qwen/qwen3-vl-8b"
      timeout: 120
      model_load_timeout: 240
      max_retries: 2

    lm_studio_agent:
      provider: lm_studio
      base_url: "http://localhost:1234/v1"
      model: "qwen/qwen3.5-9b"
      timeout: 300
      max_retries: 1
      context_length: 16384

    anthropic_sonnet:
      provider: anthropic
      api_key_env: "ANTHROPIC_API_KEY"
      model: "claude-sonnet-4"
      timeout: 60
      max_retries: 1

    openai_gpt4:
      provider: openai
      api_key_env: "OPENAI_API_KEY"
      model: "gpt-4-turbo"
      timeout: 60
      max_retries: 1

  routing:
    ocr: lm_studio_vision
    extraction: lm_studio_text
    structured_extraction: lm_studio_vision
    type_detection: lm_studio_text
    metadata_enrichment: lm_studio_text
    web_research: lm_studio_text
    quality_check: lm_studio_text

  fallback:
    enabled: true
    log_warnings: true
    rules:
      lm_studio_vision:
        - anthropic_sonnet
      lm_studio_text:
        - anthropic_sonnet
        - openai_gpt4

# Parser settings
parsers:
  pdf:
    use_ocr_fallback: true
    ocr_language: "eng"
    min_confidence: 60
    extract_images: true

  image:
    preprocess: true
    deskew: true
    denoise: true
    enhance_contrast: true
    ocr_language: "eng"
    ocr_method: "auto"  # tesseract | vision | auto (smart fallback)

# Extraction settings
extraction:
  confidence_threshold: 0.7  # Bottles below this need review
  auto_detect_type: true  # Auto-detect wine vs whiskey
  max_bottles_per_page: 50
  strict_validation: false  # If true, reject invalid data

  # LLMWhisperer API for layout-preserving OCR
  llm_whisperer:
    api_key: null  # REQUIRED: Set in user.yaml or env var LLMWHISPERER_API_KEY
    base_url: "https://llmwhisperer-api.us-central.unstract.com/api/v2"
    mode: "table"  # Extraction mode: "table", "form", or "text"
    output_mode: "layout_preserving"  # Preserves spatial layout with ASCII
    timeout: 60  # API timeout in seconds

# Git integration settings
git:
  default_branch: "tastings-backup"
  auto_commit: false  # Require explicit --commit flag
  commit_author: "Automation Bot"
  commit_email: "bot@reserve.local"

# Logging configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/automation.log"
  console: true
  file_logging: true
